[project]
name = "fpl-radar"
version = "0.1.0"
description = "FPL Radar: pipeline de ingesta y métricas para una app estática de comparación de jugadores."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
