name: Update FPL data

on:
  schedule:
    - cron: "17 6 * * *" # diario, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Sobrescribir el snapshot de la GW actual (--force)"
        type: boolean
        default: true
      history:
        description: "Descargar element-summary de cada jugador (--history)"
        type: boolean
        default: false

permissions:
  contents: read # el push va con la deploy key, no con GITHUB_TOKEN

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Deploy key con escritura: el ruleset de `main` solo deja pasar el push del bot por esta vía
      # (en repos personales no existe el bypass para "GitHub Actions").
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      # El cron SIEMPRE usa --force (en schedule `inputs` viene vacío y, en las expresiones de
      # GitHub, null != false es falso: por eso antes no sobrescribía).
      # El cron refresca a diario: sobrescribe el snapshot de la GW en curso
      # (gw{N}.parquet queda como el último estado conocido de esa GW).
      - name: Ingest
        run: >
          uv run python -m pipeline.ingest
          ${{ (github.event_name == 'schedule' || inputs.force) && '--force' || '' }}
          ${{ inputs.history && '--history' || '' }}

      - name: Export
        run: uv run python -m pipeline.export

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/captain_log data/results web/public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          gw=$(jq -r .gw web/public/data/meta.json)
          git commit -m "data: GW${gw} update $(date -u +%Y-%m-%d)"
          # El push con deploy key SÍ dispara deploy.yml (on: push a main): no hace falta llamarlo aquí.
          git push
