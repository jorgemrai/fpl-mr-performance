name: Update FPL data

on:
  schedule:
    - cron: "17 6 * * *" # diario, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Sobrescribir el snapshot de la GW actual (--force)"
        type: boolean
        default: true
      history:
        description: "Descargar element-summary de cada jugador (--history)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      # El cron refresca a diario: sobrescribe el snapshot de la GW en curso
      # (gw{N}.parquet queda como el último estado conocido de esa GW).
      - name: Ingest
        run: >
          uv run python -m pipeline.ingest
          ${{ inputs.force != false && '--force' || '' }}
          ${{ inputs.history && '--history' || '' }}

      - name: Export
        run: uv run python -m pipeline.export

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots web/public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          gw=$(jq -r .gw web/public/data/meta.json)
          git commit -m "data: GW${gw} update $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
